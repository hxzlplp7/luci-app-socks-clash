name: Build IPK Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: false
        default: ''

env:
  PACKAGE_NAME: luci-app-socks-clash

jobs:
  build-source:
    name: Build Source Package
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create package archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          mkdir -p dist/${{ env.PACKAGE_NAME }}
          
          # Copy files
          cp -r luasrc dist/${{ env.PACKAGE_NAME }}/
          cp -r root dist/${{ env.PACKAGE_NAME }}/
          cp -r po dist/${{ env.PACKAGE_NAME }}/
          cp Makefile dist/${{ env.PACKAGE_NAME }}/
          cp README.md dist/${{ env.PACKAGE_NAME }}/
          cp LICENSE dist/${{ env.PACKAGE_NAME }}/
          cp CHANGELOG.md dist/${{ env.PACKAGE_NAME }}/
          
          # Update version
          sed -i "s/PKG_VERSION:=.*/PKG_VERSION:=$VERSION/" dist/${{ env.PACKAGE_NAME }}/Makefile
          
          # Create archives
          cd dist
          tar -czvf ${{ env.PACKAGE_NAME }}_${VERSION}_all.tar.gz ${{ env.PACKAGE_NAME }}
          zip -r ${{ env.PACKAGE_NAME }}_${VERSION}_all.zip ${{ env.PACKAGE_NAME }}
          
          ls -la

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-source
          path: |
            dist/*.tar.gz
            dist/*.zip

  build-ipk:
    name: Build IPK (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86/64
            sdk_name: openwrt-sdk-23.05.2-x86-64_gcc-12.3.0_musl.Linux-x86_64
          - arch: aarch64_generic
            target: rockchip/armv8
            sdk_name: openwrt-sdk-23.05.2-rockchip-armv8_gcc-12.3.0_musl.Linux-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev

      - name: Download and extract SDK
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/23.05.2/targets/${{ matrix.target }}/${{ matrix.sdk_name }}.tar.xz"
          echo "Downloading SDK from: $SDK_URL"
          wget -q "$SDK_URL" -O sdk.tar.xz || {
            echo "Failed to download SDK, trying alternative..."
            exit 1
          }
          tar -xf sdk.tar.xz
          mv ${{ matrix.sdk_name }} sdk

      - name: Prepare package
        run: |
          mkdir -p sdk/package/${{ env.PACKAGE_NAME }}
          cp -r luasrc sdk/package/${{ env.PACKAGE_NAME }}/
          cp -r root sdk/package/${{ env.PACKAGE_NAME }}/
          cp -r po sdk/package/${{ env.PACKAGE_NAME }}/
          cp Makefile sdk/package/${{ env.PACKAGE_NAME }}/
          
          # Update version
          sed -i "s/PKG_VERSION:=.*/PKG_VERSION:=${{ steps.version.outputs.version }}/" sdk/package/${{ env.PACKAGE_NAME }}/Makefile

      - name: Build IPK
        run: |
          cd sdk
          
          # Update and install feeds
          echo "Updating feeds..."
          ./scripts/feeds update -a || true
          ./scripts/feeds install luci-base || true
          
          # Generate config
          make defconfig
          
          # Build package
          echo "Building package..."
          make package/${{ env.PACKAGE_NAME }}/compile V=s -j$(nproc) 2>&1 || \
          make package/${{ env.PACKAGE_NAME }}/compile V=s -j1 2>&1

      - name: Collect IPK files
        run: |
          mkdir -p output
          find sdk/bin -name "*.ipk" | head -20
          find sdk/bin -name "${{ env.PACKAGE_NAME }}*.ipk" -exec cp {} output/ \; || true
          
          # Also collect any luci i18n packages
          find sdk/bin -name "luci-i18n-socks-clash*.ipk" -exec cp {} output/ \; || true
          
          # Rename with arch info
          cd output
          for f in *.ipk; do
            [ -f "$f" ] && mv "$f" "${f%.ipk}_${{ matrix.arch }}.ipk"
          done
          
          ls -la || echo "No IPK files found"

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-${{ matrix.arch }}
          path: output/*.ipk
          if-no-files-found: warn

  release:
    name: Create Release
    needs: [build-source, build-ipk]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    permissions:
      contents: write
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.ipk" -o -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: SocksClash v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: release/*
          body: |
            ## 🚀 SocksClash v${{ steps.version.outputs.version }}
            
            **简介:** 一个简化的 OpenWrt 代理管理插件，专注于代理功能，不进行 DNS 劫持或透明代理。
            
            ### ✨ 功能特点
            - **SOCKS5 代理** - 默认端口 7891
            - **HTTP 代理** - 默认端口 7890
            - **混合代理** - 默认端口 7893 (支持 SOCKS5 + HTTP)
            - **现代 Web 仪表盘** - 实时监控、流量统计
            - **订阅管理** - 支持自动更新
            - **多协议支持** - SS/VMess/VLESS/Trojan/Hysteria/TUIC
            - **中文汉化** - 完整中文界面
            
            ### 📦 下载说明
            
            | 文件 | 说明 |
            |------|------|
            | `*_x86_64.ipk` | x86_64 架构 (软路由) |
            | `*_aarch64_generic.ipk` | ARM64 架构 (树莓派等) |
            | `*_all.tar.gz` | 源码包 (手动编译用) |
            
            ### 🔧 安装方法
            
            **方法一: 直接安装 IPK**
            ```bash
            opkg install luci-app-socks-clash_*.ipk
            ```
            
            **方法二: 从源码编译**
            ```bash
            # 解压源码包到 OpenWrt 的 package 目录
            tar -xzf luci-app-socks-clash_*_all.tar.gz -C /path/to/openwrt/package/
            
            # 编译
            make package/luci-app-socks-clash/compile V=s
            ```
            
            ### 🌐 使用方法
            安装后访问: `http://路由器IP/cgi-bin/luci/admin/services/socks-clash`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
